name: Build And Release GUI App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create, for example v1.0.0
        required: true
      release_title:
        description: Release title shown on GitHub
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_name: qr-generator-linux-x64
            smoke_path: ./dist/QR_Generator/QR_Generator
            test_command: xvfb-run -a python -m unittest discover -s tests -v
          - os: windows-latest
            archive_name: qr-generator-windows-x64
            smoke_path: .\dist\QR_Generator\QR_Generator.exe
            test_command: python -m unittest discover -s tests -v
          - os: macos-14
            archive_name: qr-generator-macos-arm64
            smoke_path: ./dist/QR_Generator.app/Contents/MacOS/QR_Generator
            test_command: python -m unittest discover -s tests -v

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: ${{ matrix.test_command }}

      - name: Build GUI bundle
        run: python -m PyInstaller --noconfirm --clean qr_gui.spec

      - name: Smoke test Linux artifact
        if: runner.os == 'Linux'
        run: QR_GUI_SMOKE_TEST=1 xvfb-run -a ${{ matrix.smoke_path }}

      - name: Smoke test macOS artifact
        if: runner.os == 'macOS'
        run: QR_GUI_SMOKE_TEST=1 ${{ matrix.smoke_path }}

      - name: Smoke test Windows artifact
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:QR_GUI_SMOKE_TEST = "1"
          & ${{ matrix.smoke_path }}

      - name: Create Linux release archive
        if: runner.os == 'Linux'
        working-directory: dist
        run: zip -r "${{ github.workspace }}/${{ matrix.archive_name }}.zip" QR_Generator

      - name: Create macOS release archive
        if: runner.os == 'macOS'
        working-directory: dist
        run: ditto -c -k --sequesterRsrc --keepParent QR_Generator.app "${{ github.workspace }}/${{ matrix.archive_name }}.zip"

      - name: Create Windows release archive
        if: runner.os == 'Windows'
        shell: powershell
        run: Compress-Archive -Path dist\QR_Generator\* -DestinationPath $env:GITHUB_WORKSPACE\${{ matrix.archive_name }}.zip -Force

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ github.workspace }}/${{ matrix.archive_name }}.zip

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TITLE: ${{ inputs.release_title }}
        run: |
          set -eu
          title="${RELEASE_TITLE:-$RELEASE_TAG}"
          shopt -s nullglob
          assets=(release-assets/*/*.zip)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release archives were downloaded."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$title" \
              --target "$GITHUB_SHA" \
              --notes "Automated release created by the Build And Release GUI App workflow."
          fi
